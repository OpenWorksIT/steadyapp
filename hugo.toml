baseURL = "https://steadyapp.co.za/"
languageCode = "en-ZA"
title = "Steady"
disableKinds = ["taxonomy", "term", "rss"]
enableRobotsTXT = true

[params]
  description = "Steady is a calm app for the days between sessions, for mental healthcare practices. Patients check in; their clinician sees how the fortnight went. Built in South Africa, open source, on your practice's own server."
  email = "info@openworks.co.za"
  whatsapp = "https://wa.me/27767689155"
  whatsappLabel = "+27 76 768 9155"
  source = "https://github.com/OpenWorksIT/steady"
  privacyPolicy = "https://www.openworks.co.za/steady/privacy/"
  # the patients page shows a button for each (live since 18 Nov 2026; the App Store lists
  # Steady in South Africa, so the link names the za store)
  appStore = "https://apps.apple.com/za/app/steady-check-in/id6827262084"
  googlePlay = "https://play.google.com/store/apps/details?id=za.co.openworks.steady"

[[menus.main]]
  name = "For practices"
  pageRef = "/practices"
  weight = 10
[[menus.main]]
  name = "For patients"
  pageRef = "/patients"
  weight = 20
[[menus.main]]
  name = "The science"
  pageRef = "/science"
  weight = 30
[[menus.main]]
  name = "Community"
  pageRef = "/community"
  weight = 35
[[menus.main]]
  name = "Privacy and security"
  pageRef = "/security"
  weight = 40
[[menus.main]]
  name = "Our story"
  pageRef = "/story"
  weight = 50

[markup.goldmark.renderer]
  unsafe = false

[minify]
  minifyOutput = true
